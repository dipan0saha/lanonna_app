[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lanonna-activity-copy"
version = "0.1.0"
description = "Shared activity and notification vocabulary (types, params, English server copy) for La Nonna API and worker"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
