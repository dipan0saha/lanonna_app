# tags: full, destructive
appId: com.lanonna.lanonna
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "I already have an account|Welcome back"
    timeout: 60000
- runFlow:
    when:
      visible: "I already have an account"
    commands:
      - tapOn: "I already have an account"
- runFlow: ../subflows/sign_in_form_as.yaml
- runFlow:
    when:
      visible: "Complete your profile"
    file: ../subflows/owner_onboarding_to_home.yaml
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*"
    timeout: 90000
    optional: true
- runFlow: ../subflows/open_account.yaml
- scrollUntilVisible:
    element:
      id: account_delete_entry
    direction: DOWN
    timeout: 45000
- tapOn:
    id: account_delete_entry
- extendedWaitUntil:
    visible:
      id: delete_account_submit
    timeout: 20000
- tapOn:
    id: delete_account_submit
- tapOn:
    text: "Delete account"
    optional: true
- extendedWaitUntil:
    visible: "I already have an account|Skip|Welcome back"
    timeout: 90000
