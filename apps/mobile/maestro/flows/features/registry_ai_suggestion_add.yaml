appId: com.lanonna.lanonna
---
- runFlow: ../subflows/ensure_signed_in.yaml
- runFlow: ../subflows/ensure_primary_baby.yaml
- tapOn: ".*Tab 4 of 5.*"
- extendedWaitUntil:
    visible: "Registry"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*AI-suggested items by stage and age.*"
    direction: DOWN
    timeout: 30000
- tapOn: ".*AI-suggested items by stage and age.*"
- extendedWaitUntil:
    visible: "AI Suggestions"
    timeout: 10000
- tapOn:
    id: registry_suggestion_add_crib_mattress
- extendedWaitUntil:
    visible: "Add Registry Item"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: registry_item_save
    direction: DOWN
    timeout: 20000
- tapOn:
    id: registry_item_save
- extendedWaitUntil:
    visible: "AI Suggestions"
    timeout: 20000
- assertNotVisible:
    id: registry_suggestion_add_crib_mattress
