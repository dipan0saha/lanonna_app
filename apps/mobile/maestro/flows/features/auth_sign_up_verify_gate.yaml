# tags: full, auth
# AUTH-001 UI sign-up stops at verify screen; inbox link (AUTH-002) is manual.
appId: com.lanonna.lanonna
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Skip|I already have an account"
    timeout: 60000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Create account|Sign up"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "I already have an account"
    commands:
      - tapOn: "I already have an account"
      - tapOn: "Sign up"
- extendedWaitUntil:
    visible:
      id: auth_signup_email
    timeout: 30000
- tapOn:
    id: auth_signup_email
- inputText: ${E2E_SIGNUP_EMAIL}
- tapOn:
    id: auth_signup_password
- inputText: ${E2E_SIGNUP_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth_signup_submit
- extendedWaitUntil:
    visible: "Verify|check your email|email"
    timeout: 60000
