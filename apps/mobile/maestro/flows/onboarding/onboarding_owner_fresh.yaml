appId: com.lanonna.lanonna
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "I already have an account|Welcome back|Skip"
    timeout: 60000
- runFlow:
    when:
      visible: "I already have an account"
    commands:
      - tapOn: "I already have an account"
      - extendedWaitUntil:
          visible: "Welcome back"
          timeout: 20000
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    file: ../subflows/sign_in_form_as.yaml
- runFlow: ../subflows/owner_onboarding_to_home.yaml
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*"
    timeout: 90000
- assertVisible: ".*Tab 1 of 5.*"
