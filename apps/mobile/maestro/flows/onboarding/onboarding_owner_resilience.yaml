# tags: full, onboarding
# ONB: back, background, and relaunch during owner onboarding.
appId: com.lanonna.lanonna
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "I already have an account|Welcome back|Skip"
    timeout: 60000
- runFlow:
    when:
      visible: "I already have an account"
    commands:
      - tapOn: "I already have an account"
- runFlow: ../subflows/sign_in_form_as.yaml
- extendedWaitUntil:
    visible: "Complete your profile|Create your baby's profile"
    timeout: 60000
- back
- launchApp
- extendedWaitUntil:
    visible: "Complete your profile|Create your baby's profile|Welcome back"
    timeout: 45000
- runFlow: ../subflows/owner_onboarding_to_home.yaml
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*"
    timeout: 90000
