appId: com.lanonna.lanonna
---
# P0: BIO-006 — sign in with biometrics after settings_biometric_enable.yaml on the
# same install (no clearState: that would drop the stored biometric credential).
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "onboarding_have_account|auth_sign_in_biometric|shell_baby_switcher"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: onboarding_have_account
    commands:
      - tapOn:
          id: onboarding_have_account
- extendedWaitUntil:
    visible:
      id: "auth_sign_in_biometric|shell_baby_switcher"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: auth_sign_in_biometric
    commands:
      - tapOn:
          id: auth_sign_in_biometric
- extendedWaitUntil:
    visible:
      id: shell_baby_switcher
    timeout: 90000
