appId: com.lanonna.lanonna
---
# P0: BIO-006 — sign in with biometrics after prior enrollment (emulator must have biometrics).
# Prerequisite: run settings_biometric_enable.yaml once on the same install.
- clearState
- launchApp
- extendedWaitUntil:
    visible: "I already have an account|Welcome back"
    timeout: 45000
- runFlow:
    when:
      visible: "I already have an account"
    commands:
      - tapOn: "I already have an account"
- extendedWaitUntil:
    visible:
      id: auth_sign_in_biometric
    timeout: 30000
    optional: true
- tapOn:
    id: auth_sign_in_biometric
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*|Complete your profile"
    timeout: 90000
