- runFlow: subflows/sign_in_owner.yaml
- runFlow: ../subflows/ensure_primary_baby.yaml
- tapOn:
    id: shell_invite_family
- extendedWaitUntil:
    visible:
      id: batch_invite_send
    timeout: 30000
