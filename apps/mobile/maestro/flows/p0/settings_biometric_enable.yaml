appId: com.lanonna.lanonna
---
# P0: BIO-001 — enable biometric unlock in Settings.
# Optional (P0_RUN_BIOMETRIC=1): the emulator needs an enrolled fingerprint, and the
# system prompt needs `adb -e emu finger touch 1` while this flow waits.
- runFlow: subflows/sign_in_owner.yaml
- runFlow: ../subflows/ensure_primary_baby.yaml
- runFlow: subflows/open_account.yaml
- scrollUntilVisible:
    element:
      id: account_settings
    direction: DOWN
    timeout: 45000
- tapOn:
    id: account_settings
- scrollUntilVisible:
    element:
      id: settings_biometric_unlock
    direction: DOWN
    timeout: 30000
- tapOn:
    id: settings_biometric_unlock
