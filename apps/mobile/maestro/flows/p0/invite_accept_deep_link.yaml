appId: com.lanonna.lanonna
---
# P0: INV-001 / INV-004 — a signed-out follower opens an invite link, signs in, and the
# invite is accepted. The runner opens the deep link with adb right after launch (see run-maestro-p0.sh).
- extendedWaitUntil:
    visible:
      id: "onboarding_have_account|auth_login_email|shell_baby_switcher"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: onboarding_have_account
    commands:
      - tapOn:
          id: onboarding_have_account
- runFlow:
    when:
      visible:
        id: auth_login_email
    commands:
      - tapOn:
          id: auth_login_email
      - eraseText
      - inputText: ${FOLLOWER_TEST_EMAIL}
      - tapOn:
          id: auth_login_password
      - eraseText
      - inputText: ${FOLLOWER_TEST_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: auth_sign_in
- extendedWaitUntil:
    visible:
      id: shell_baby_switcher
    timeout: 90000
# The accepted invite is for the second fixture baby, which the follower did not belong to.
- tapOn:
    id: shell_baby_switcher
- extendedWaitUntil:
    visible:
      id: "baby_switcher_${SECOND_BABY_SWITCHER_ID}"
    timeout: 30000
