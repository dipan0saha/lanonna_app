appId: com.lanonna.lanonna
---
# P0: INV-001 / INV-004 — deep link opened via adb before this flow (see run-maestro-p0.sh).
- extendedWaitUntil:
    visible: ".*invite.*|Accept|Welcome"
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    file: ../../subflows/sign_in_form_as.yaml
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*|Complete your profile|Confirm"
    timeout: 60000
