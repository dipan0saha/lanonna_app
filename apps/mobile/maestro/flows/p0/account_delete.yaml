appId: com.lanonna.lanonna
---
# P0: ACC delete — a signed-in owner deletes their account through the app and lands
# signed out. Destructive: run-maestro-p0.sh only points it at the disposable account
# auth_sign_up.yaml just created (P0_DISPOSABLE_EMAIL / P0_DISPOSABLE_PASSWORD).
- runFlow:
    file: subflows/sign_in_as.yaml
    env:
      SIGN_IN_EMAIL: ${P0_DISPOSABLE_EMAIL}
      SIGN_IN_PASSWORD: ${P0_DISPOSABLE_PASSWORD}
- runFlow: subflows/to_home.yaml
- runFlow: subflows/open_account.yaml
- scrollUntilVisible:
    element:
      id: account_delete_entry
    direction: DOWN
    timeout: 45000
- tapOn:
    id: account_delete_entry
- extendedWaitUntil:
    visible:
      id: delete_account_submit
    timeout: 20000
- tapOn:
    id: delete_account_submit
# Confirm dialog (shared AppConfirmDialog), then the password re-auth prompt.
- extendedWaitUntil:
    visible:
      id: "app_confirm_dialog_confirm|delete_account_reauth_password"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: app_confirm_dialog_confirm
    commands:
      - tapOn:
          id: app_confirm_dialog_confirm
- extendedWaitUntil:
    visible:
      id: "delete_account_reauth_password|onboarding_have_account|onboarding_skip"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: delete_account_reauth_password
    commands:
      - tapOn:
          id: delete_account_reauth_password
      - inputText: ${P0_DISPOSABLE_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: delete_account_reauth_continue
- extendedWaitUntil:
    visible:
      id: "onboarding_have_account|onboarding_skip|auth_login_email"
    timeout: 90000
