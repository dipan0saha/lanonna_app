appId: com.lanonna.lanonna
---
# P0: AUTH-004 — email/password sign-in from a cleared app lands on home.
- runFlow:
    file: subflows/sign_in_as.yaml
    env:
      SIGN_IN_EMAIL: ${SMOKE_TEST_EMAIL}
      SIGN_IN_PASSWORD: ${SMOKE_TEST_PASSWORD}
- runFlow: subflows/to_home.yaml
- assertVisible:
    id: shell_baby_switcher
