# tags: full, invite
# #427: Accept before sign-in → Log in → invite accept continues (not login loop).
appId: com.lanonna.lanonna
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: invite_landing_accept
    timeout: 60000
- tapOn:
    id: invite_landing_accept
- extendedWaitUntil:
    visible:
      id: auth_signup_email
    timeout: 30000
- tapOn: "Log in"
    optional: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- tapOn:
    id: auth_login_email
- eraseText
- inputText: ${FOLLOWER_TEST_EMAIL}
- tapOn:
    id: auth_login_password
- eraseText
- inputText: ${FOLLOWER_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: auth_sign_in
- extendedWaitUntil:
    notVisible: "Welcome back"
    timeout: 45000
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*|Confirm|relationship|Accept"
    timeout: 90000
