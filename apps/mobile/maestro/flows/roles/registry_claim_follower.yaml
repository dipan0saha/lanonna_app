# tags: full, registry
appId: com.lanonna.lanonna
---
- runFlow: ../subflows/ensure_signed_in_as.yaml
- runFlow: ../subflows/ensure_primary_baby.yaml
- tapOn: ".*Tab 4 of 5.*"
- extendedWaitUntil:
    visible: "Registry"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Maestro Test Gift.*"
    direction: DOWN
    timeout: 45000
- tapOn: ".*Maestro Test Gift.*"
- extendedWaitUntil:
    visible: "Mark as purchased|Claim|Purchased"
    timeout: 15000
- tapOn: "Mark as purchased"
    optional: true
- back
