appId: com.lanonna.lanonna
---
- clearState
- launchApp
- tapOn:
    text: "I already have an account"
    optional: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Welcome back"
    file: sign_in_form.yaml
- runFlow: owner_onboarding_to_home.yaml
- extendedWaitUntil:
    visible: ".*Tab 1 of 5.*"
    timeout: 45000
