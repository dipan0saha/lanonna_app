name: E2E smoke (Maestro)

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "scripts/e2e/**"
      - "infra/db/provision_maestro_fixtures.py"
      - ".github/workflows/e2e-smoke.yml"

jobs:
  maestro-smoke:
    name: Maestro smoke
    runs-on: ubuntu-latest
    # Skip (do not fail) when secrets are not configured on the fork/repo.
    if: ${{ secrets.SMOKE_TEST_PASSWORD != '' && secrets.DB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "${HOME}/.maestro/bin" >> "${GITHUB_PATH}"

      - name: AVD cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-${{ runner.os }}

      - name: Start emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
            export ANDROID_SERIAL=emulator-5554
            export SMOKE_TEST_EMAIL="${{ vars.SMOKE_TEST_EMAIL || 'lanonna.dev.smoke@test.com' }}"
            export SMOKE_TEST_PASSWORD="${{ secrets.SMOKE_TEST_PASSWORD }}"
            export FOLLOWER_TEST_EMAIL="${{ vars.FOLLOWER_TEST_EMAIL || 'lanonna.dev.follower@test.com' }}"
            export FOLLOWER_TEST_PASSWORD="${{ secrets.FOLLOWER_TEST_PASSWORD || secrets.SMOKE_TEST_PASSWORD }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export APP_CHECK_DEBUG_TOKEN="${{ secrets.APP_CHECK_DEBUG_TOKEN }}"
            chmod +x scripts/e2e/run_smoke.sh scripts/e2e/prereq/*.sh apps/mobile/maestro/scripts/*.sh
            ./scripts/e2e/run_smoke.sh --smoke

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-e2e
          path: .e2e-out/
          if-no-files-found: ignore
