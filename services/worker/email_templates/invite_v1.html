<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're invited to La Nonna</title>
</head>
<body style="margin:0;padding:0;background:#faf6f1;font-family:Georgia,'Times New Roman',serif;color:#3d2c29;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#faf6f1;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:32px 28px;">
          <tr>
            <td>
              <p style="margin:0 0 8px;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#a35a2e;">La Nonna</p>
              <h1 style="margin:0 0 16px;font-size:26px;line-height:1.3;font-weight:700;">You're invited</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.55;">
                {{invite_intro_html}}
              </p>
              {{relationship_block}}
              <p style="margin:24px 0;">
                <a href="{{invite_url}}" style="display:inline-block;background:#c96b4a;color:#ffffff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:999px;">Accept invitation</a>
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#6b5b57;">
                If the button doesn't work, copy this link into your browser:<br />
                <a href="{{invite_url}}" style="color:#a35a2e;word-break:break-all;">{{invite_url}}</a>
              </p>
              <p style="margin:24px 0 0;font-size:12px;color:#9a8a85;">
                This invitation was sent to {{invitee_email}} and expires on {{expires_at}}.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
